<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié - Confidences</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">

    <a href="/" class="brand">
      <span class="brand-icon">♥</span>
      <span>Confidences</span>
    </a>

    <section class="auth-card">

      <span class="eyebrow">RÉCUPÉRATION DU COMPTE</span>

      <h1>Mot de passe oublié ?</h1>

      <p>
        Entrez votre adresse e-mail et nous vous enverrons
        un lien pour choisir un nouveau mot de passe.
      </p>

      <form id="forgot-password-form">

        <label>
          Adresse e-mail
          <input
            type="email"
            name="email"
            autocomplete="email"
            required
          >
        </label>

        <button
          type="submit"
          class="btn btn-primary btn-full"
        >
          Envoyer le lien
        </button>

      </form>

      <p
        class="form-message"
        id="forgot-password-message"
        role="status"
        aria-live="polite"
      ></p>

      <p class="auth-switch">
        <a href="/login.html">← Retour à la connexion</a>
      </p>

      <a class="back-link" href="/">
        Retour à l'accueil
      </a>

    </section>

  </main>

  <script src="forgot-password.js" defer></script>
</body>
</html>
