<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe - Confidences</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">

    <a href="/" class="brand">
      <span class="brand-icon">♥</span>
      <span>Confidences</span>
    </a>

    <section class="auth-card">

      <span class="eyebrow">RÉCUPÉRATION DU COMPTE</span>

      <h1>Choisir un nouveau mot de passe</h1>

      <p>
        Entrez votre nouveau mot de passe ci-dessous.
      </p>

      <form id="reset-password-form">

        <label>
          Nouveau mot de passe
          <input
            type="password"
            name="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </label>

        <label>
          Confirmer le nouveau mot de passe
          <input
            type="password"
            name="passwordConfirmation"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </label>

        <button
          type="submit"
          class="btn btn-primary btn-full"
        >
          Réinitialiser mon mot de passe
        </button>

      </form>

      <p
        class="form-message"
        id="reset-password-message"
        role="status"
        aria-live="polite"
      ></p>

      <p class="auth-switch">
        <a href="/login.html">← Retour à la connexion</a>
      </p>

      <a class="back-link" href="/">
        Retour à l'accueil
      </a>

    </section>

  </main>

  <script src="reset-password.js" defer></script>
</body>
</html>
